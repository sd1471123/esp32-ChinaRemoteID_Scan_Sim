name: ESP32 Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target: [esp32s3, esp32c5]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # page_gz.h 不入库（.gitignore 排除），编译前必须先由源码生成
    - name: Generate gzip page resources
      run: python3 tools/gen_gzpage.py

    - name: Build unified firmware (${{ matrix.target }})
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v6.1
        target: ${{ matrix.target }}
        path: '.'
        command: idf.py build

    - name: Collect firmware (${{ matrix.target }})
      run: |
        # ESP-IDF CI 容器以 root 写出 build/，runner 用户无权限，先改属主
        sudo chown -R $(id -u):$(id -g) build
        # 按芯片分目录收集，两个 target 的 bin 同名，绝不能混放
        mkdir -p dist/remoteid_scanner_${{ matrix.target }}
        cp build/*.bin build/*.elf dist/remoteid_scanner_${{ matrix.target }}/ 2>/dev/null || true
        cp -r build/bootloader build/partition_table dist/remoteid_scanner_${{ matrix.target }}/
        cd dist && zip -r ../esp32-ChinaRemoteID_Scan_Sim-${{ matrix.target }}.zip . && cd ..

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32-ChinaRemoteID_Scan_Sim-${{ matrix.target }}
        path: esp32-ChinaRemoteID_Scan_Sim-${{ matrix.target }}.zip

  # 自动发布 Release（仅 tag 触发）：合并两芯片构建产物
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true
        path: rel

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          rel/esp32-ChinaRemoteID_Scan_Sim-esp32s3.zip
          rel/esp32-ChinaRemoteID_Scan_Sim-esp32c5.zip
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        fail_on_unmatched_files: true
        body: |
          ESP32-ChinaRemoteID_Scan_Sim 统一收发固件 v${{ github.ref_name }}

          单固件双模式：发射（GB 42590 / GB 46750 两档）+ 接收监测，
          连接设备热点访问 http://192.168.4.1 在线配置与切换。

          ## 下载

          | 芯片 | 完整包 |
          |------|--------|
          | ESP32-S3（N16R8 实测） | `esp32-ChinaRemoteID_Scan_Sim-esp32s3.zip` |
          | ESP32-C5（N16R8 实测） | `esp32-ChinaRemoteID_Scan_Sim-esp32c5.zip` |

          每个 zip 内含：`remoteid_scanner/`（固件 + bootloader + 分区表）、
          `remoteid_scanner.bin`、`remoteid_scanner.elf`。

          ## 烧录（ESP-IDF / esptool 环境）

          **ESP32-S3**（bootloader 偏移 0x0）：
          ```bash
          esptool.py --chip esp32s3 --baud 460800 write_flash \
            0x0 remoteid_scanner_esp32s3/bootloader/bootloader.bin \
            0x8000 remoteid_scanner_esp32s3/partition_table/partition-table.bin \
            0x10000 remoteid_scanner_esp32s3/remoteid_scanner.bin
          ```

          **ESP32-C5**（bootloader 偏移 0x2000，注意与 S3 不同）：
          ```bash
          esptool.py --chip esp32c5 --baud 460800 write_flash \
            0x2000 remoteid_scanner_esp32c5/bootloader/bootloader.bin \
            0x8000 remoteid_scanner_esp32c5/partition_table/partition-table.bin \
            0x10000 remoteid_scanner_esp32c5/remoteid_scanner.bin
          ```

          也可使用 [espressif flash download tool](https://www.espressif.com/en/support/download/other-tools)
          图形界面烧录（对应芯片型号 + 上表地址）。

          两个芯片均按 **16MB Flash** 构建（factory 分区 1.5MB）。
          本 Release 由 CI 自动构建于 ${{ github.ref_name }}，功能说明见仓库 README。
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
